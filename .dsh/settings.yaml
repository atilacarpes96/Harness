agent-default-model:
  model: dsh-4b:16k
  provider: ollama
llm-pi-ai:
  providers:
    ollama:
      baseURL: http://127.0.0.1:11434/v1
      models:
        - contextWindow: 32768
          id: qwen3-vl:8b
          input:
            - text
            - image
          maxTokens: 8192
          name: qwen3-vl:8b
          reasoningEfforts:
            "off":
            high: high
          compat:
            thinkingFormat: qwen
        - contextWindow: 32768
          id: qwen3-vl:4b-instruct
          input:
            - text
            - image
          maxTokens: 8192
          name: qwen3-vl:4b-instruct
        - contextWindow: 16384
          id: dsh-4b:16k
          input:
            - text
            - image
          maxTokens: 4096
          name: dsh-4b:16k (4b-instruct, contexto 16k)
        - contextWindow: 12288
          id: dsh-8b:12k
          input:
            - text
            - image
          maxTokens: 3072
          name: dsh-8b:12k (8b-instruct, contexto 12k)
        - contextWindow: 32768
          id: qwen3-vl:8b-instruct
          input:
            - text
            - image
          maxTokens: 8192
          name: qwen3-vl:8b-instruct
        - contextWindow: 1000000
          id: glm-5.2:cloud
          input:
            - text
          maxTokens: 131072
          name: glm-5.2:cloud
        - contextWindow: 524288
          id: minimax-m3:cloud
          input:
            - text
          maxTokens: 131072
          name: minimax-m3:cloud
        - id: gemma4:26b
          input:
            - text
          name: gemma4:26b
        - contextWindow: 128000
          id: critico-cpu:latest
          input:
            - text
            - image
          name: critico-cpu:latest
        - contextWindow: 262144
          id: critico-v83-cpu:latest
          input:
            - text
            - image
          name: critico-v83-cpu:latest
        - contextWindow: 128000
          id: qwen2.5vl:3b
          input:
            - text
            - image
          name: qwen2.5vl:3b
        - contextWindow: 32768
          id: tradutor-cpu:latest
          input:
            - text
          name: tradutor-cpu:latest
      displayName: Ollama
      apiKeyEnv: OLLAMA_LAUNCH_DSH_API_KEY
      api: openai-completions
    anthropic:
      # Rota NATIVA da API de Mensagens (o dsh traz AnthropicMessagesCompat),
      # e nao a camada de compatibilidade OpenAI: uso de ferramenta, cache de
      # prompt e thinking funcionam do jeito certo.
      #
      # Exige a variavel de ambiente ANTHROPIC_API_KEY. Cobranca e por token,
      # separada da assinatura do Claude Code.
      baseURL: https://api.anthropic.com
      api: anthropic-messages
      apiKeyEnv: ANTHROPIC_API_KEY
      displayName: Claude (API Anthropic)
      models:
        - id: claude-opus-5
          name: Claude Opus 5 (o mais capaz)
          contextWindow: 1000000
          maxTokens: 64000
          input:
            - text
            - image
        - id: claude-sonnet-5
          name: Claude Sonnet 5 (equilibrio)
          contextWindow: 1000000
          maxTokens: 64000
          input:
            - text
            - image
        - id: claude-haiku-4-5
          name: Claude Haiku 4.5 (mais barato)
          contextWindow: 200000
          maxTokens: 8192
          input:
            - text
            - image
web-search-deepseek:
  apiKeyEnv: OLLAMA_LAUNCH_DSH_API_KEY
  baseURL: http://127.0.0.1:11434/v1
  model: qwen3-vl:8b
agent-presets:
  default: enxuto
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
