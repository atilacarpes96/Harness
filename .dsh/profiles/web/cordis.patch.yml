# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Migrado do .dsh/settings.yaml pelo dsh 0.2 em 07/10/2026 (o original ficou
# em .dsh/settings.yaml.imported). Mesmo bloco do profile headless.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: ollama
    # dsh-4b:32k e o mesmo qwen3-vl:4b-instruct com num_ctx 32768. A tag crua roda
    # com 4096 no Ollama e o pedido do usuario era cortado (07/10/2026, dsh 0.2).
    model: dsh-4b:32k
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ollama:
        baseURL: http://127.0.0.1:11434/v1
        models:
          - contextWindow: 32768
            id: qwen3-vl:4b-instruct
            input:
              - text
              - image
            maxTokens: 8192
            name: qwen3-vl:4b-instruct
          - contextWindow: 65536
            id: dsh-9b:64k
            input:
              - text
              - image
            maxTokens: 4096
            name: dsh-9b:64k (qwen3.5 9b, contexto 64k) - preciso
          - contextWindow: 32768
            id: dsh-4b:32k
            input:
              - text
              - image
            maxTokens: 4096
            name: dsh-4b:32k (4b-instruct, contexto 32k) - padrao
          - contextWindow: 16384
            id: dsh-4b:16k
            input:
              - text
              - image
            maxTokens: 2048
            name: dsh-4b:16k (4b-instruct, contexto 16k)
          - contextWindow: 1000000
            id: glm-5.2:cloud
            input:
              - text
            maxTokens: 131072
            name: glm-5.2:cloud
          - contextWindow: 524288
            id: minimax-m3:cloud
            input:
              - text
            maxTokens: 131072
            name: minimax-m3:cloud
        displayName: Ollama
        apiKeyEnv: OLLAMA_LAUNCH_DSH_API_KEY
        api: openai-completions
      nvidia:
        apiKeyEnv: NVIDIA_API_KEY
- id: web-search-deepseek
  name: "@deepseek-ai/dsh-web-search-deepseek"
  config:
    apiKeyEnv: OLLAMA_LAUNCH_DSH_API_KEY
    baseURL: http://127.0.0.1:11434/v1
    model: dsh-4b:32k
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# Modo "Enxuto", recriado em 03/11/2026 para o dsh 0.2.2.
#
# O preset antigo (.dsh/.agent-presets/enxuto) deixou de ser lido na migracao
# para o dsh 0.2 (07/10/2026): a web voltou ao "Modo padrao", que manda 40
# ferramentas e ~13 mil tokens de prompt por chamada (medido pelo proxy-log).
# No 0.2 um modo e uma entrada @deepseek-ai/dsh-agent-preset no perfil.
#
# Base: o preset "standard" do 0.2.2 sem tool-jobs, tool-schedule, skills,
# goal, planning, subagent_fork/workflow, tool-web e plugin_manager. Ficam
# shell, arquivos, perguntar ao usuario, present (mostrar arquivo), todo,
# subagent (o caso "le a pasta inteira" de 05/09) e a compactacao. As
# ferramentas dos plugins locais vem dos bundles e chegam em qualquer modo.
- insert:
    - id: preset-enxuto
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: enxuto
        name: Enxuto
        description: >-
          Shell, arquivos e os plugins locais (tela, programas, imagem,
          transcrição, documentos), com menos ferramentas para o modelo local
          acertar mais e responder mais rápido.
        order: 0
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: time-context
            name: "@deepseek-ai/dsh-time-context"
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              applyPatch: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              # Maior que o padrao (8192/4096/1024): transcricao e documento
              # voltam com ate ~12 mil caracteres de proposito.
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 12288
                  headChars: 8192
                  tailChars: 2048
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: "@deepseek-ai/dsh-tool-subagent-control"
              - id: tool-subagent
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: present
            name: "@deepseek-ai/dsh-tool-present"
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: enxuto

# Terminal do agente: acesso total, perguntando antes do que e arriscado
# (03/11/2026, escolha do usuario). O modo "workspace-write" do dsh nao
# funciona nesta pasta: ele grava um rotulo de integridade Low na pasta e isso
# exige WRITE_OWNER, que o usuario nao tem no disco E: (ver STATUS.md). Aqui o
# isolamento fica desligado e a aprovacao em "ask": o plugin confirmar-perigoso
# devolve "perguntar" para apagar, formatar, mexer no Windows, instalar, git
# push e mandar dados para fora. DSH_PERMISSION_MODE ainda manda, se definida.
- id: sandbox-policy
  name: "@deepseek-ai/dsh-sandbox-policy"
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'danger-full-access'
    workspaceRoot: !!js process.cwd()
- id: approval
  name: "@deepseek-ai/dsh-user-approval"
  config:
    policy: ask
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      total-com-confirmacao:
        sandbox: danger-full-access
        approval: ask
        name: Acesso total com confirmação
        description: >-
          Mexe em qualquer pasta, mas para e pergunta antes de apagar, formatar,
          mexer no Windows, instalar, dar git push ou mandar dados para fora.
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: total-com-confirmacao

# Catalogo proprio na aba "Descubra" de Plug-ins (03/11/2026): o indice fica no
# repositorio publico do Harness e e gerado por catalogo/gerar-catalogo.mjs.
- id: plugin-market
  name: "@deepseek-ai/dsh-plugin-market"
  config:
    indexes:
      - https://raw.githubusercontent.com/atilacarpes96/Harness/main/catalogo/plugins.json
