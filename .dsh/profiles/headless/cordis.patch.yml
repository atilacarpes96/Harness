# Camada de patch do profile headless, aplicada depois de cada bundle.
#
# Conteúdo: o corte de ferramentas "enxuto" — o equivalente headless do agent
# preset `.dsh/.agent-presets/enxuto/`, que o profile `web` recebe via
# `agent-presets: default: enxuto` no settings.yaml.
#
# Por que aqui e não lá: `agent-presets` é conceito do app web (ele monta a
# sessão do agente a partir de um preset). O launcher não tem `--preset`, então
# no headless o mesmo corte só existe se estiver nesta camada — ou passado à mão
# com `--patch`, que era o estado até 31/08 e ninguém lembrava de fazer.
#
# Medido pelo proxy (harness-bench/proxy-log.mjs), pergunta trivial no dsh-4b:16k:
#   sem este corte: 28 ferramentas, 8.282 prompt_tokens
#   com este corte: 10 ferramentas, 3.082 prompt_tokens  (-63%)
#
# Ficam: pwsh, read/write/edit/read_image, glob/grep, e os plugins locais
# (analisar_tela/ver_tela, validar_plugin_local — esses vêm do plano do host
# pelos bundles do package.json, não desta camada).

# Orquestração multi-agente — nunca usada aqui, e cara (workflow sozinho = 4032 chars)
- id: tool-workflow
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-control
  disabled: true

# Goals / todos / plano — cerimônia de agente longo, irrelevante pra turno curto
- id: tool-goal
  disabled: true
- id: tool-todo
  disabled: true
- id: plan-mode
  disabled: true

# Busca web: aponta pro Ollama local, não é busca de verdade neste setup
- id: tool-web
  disabled: true

# Skills: nenhuma skill instalada neste profile
- id: tool-skill
  disabled: true

# Jobs em background: modelo pequeno não gerencia isso bem
- id: tool-jobs
  disabled: true

# str_replace_editor (3148 chars) é redundante com read/write/edit do tool-fs
- id: tool-str-replace-editor
  disabled: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: ollama
    # dsh-4b:32k e o mesmo qwen3-vl:4b-instruct com num_ctx 32768. A tag crua roda
    # com 4096 no Ollama e o pedido do usuario era cortado (07/10/2026, dsh 0.2).
    model: dsh-4b:32k
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ollama:
        baseURL: http://127.0.0.1:11434/v1
        models:
          - contextWindow: 32768
            id: qwen3-vl:4b-instruct
            input:
              - text
              - image
            maxTokens: 8192
            name: qwen3-vl:4b-instruct
          - contextWindow: 65536
            id: dsh-9b:64k
            input:
              - text
              - image
            maxTokens: 4096
            name: dsh-9b:64k (qwen3.5 9b, contexto 64k) - preciso
          - contextWindow: 32768
            id: dsh-4b:32k
            input:
              - text
              - image
            maxTokens: 4096
            name: dsh-4b:32k (4b-instruct, contexto 32k) - padrao
          - contextWindow: 16384
            id: dsh-4b:16k
            input:
              - text
              - image
            maxTokens: 2048
            name: dsh-4b:16k (4b-instruct, contexto 16k)
          - contextWindow: 1000000
            id: glm-5.2:cloud
            input:
              - text
            maxTokens: 131072
            name: glm-5.2:cloud
          - contextWindow: 524288
            id: minimax-m3:cloud
            input:
              - text
            maxTokens: 131072
            name: minimax-m3:cloud
        displayName: Ollama
        apiKeyEnv: OLLAMA_LAUNCH_DSH_API_KEY
        api: openai-completions
      nvidia:
        apiKeyEnv: NVIDIA_API_KEY
- id: web-search-deepseek
  name: "@deepseek-ai/dsh-web-search-deepseek"
  config:
    apiKeyEnv: OLLAMA_LAUNCH_DSH_API_KEY
    baseURL: http://127.0.0.1:11434/v1
    model: dsh-4b:32k
